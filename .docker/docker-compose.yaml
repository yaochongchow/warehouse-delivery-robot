services:
  ros2:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    environment:
      - DISPLAY=:99
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - ROS_DOMAIN_ID=0
    volumes:
      - ../src:/ros2_ws/src
    ports:
      - "6080:6080"
      - "8080:8080"
      - "9090:9090"
    privileged: true
    stdin_open: true
    tty: true
